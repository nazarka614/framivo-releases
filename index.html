  .sel { opacity: 0; animation: sel 9s infinite; }
  .secret { animation: blur 9s infinite; }

const ua = navigator.userAgent;
const OS = /Windows/i.test(ua) ? "win" : /Mac/i.test(ua) ? "mac" : /Linux|X11/i.test(ua) && !/Android/i.test(ua) ? "linux" : "win";
let lang = "ru";
try { lang = localStorage.getItem("lang") || (navigator.language || "ru").slice(0, 2); } catch (e) {}
if (!T[lang]) lang = lang === "be" || lang === "kk" ? "ru" : "en";
let release = null;

function pick(re) { return release && release.assets ? release.assets.find((a) => re.test(a.name)) : undefined; }
function linkHtml(asset, label) { return asset ? `<a href="${asset.browser_download_url}">${label} · ${(asset.size / 1048576).toFixed(1)} MB</a>` : ""; }

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("shot").src = `img/app-home-${lang}.png`;
  document.getElementById("shot2").src = `img/app-video-${lang}.png`;
  const dv = document.getElementById("demo");
  if (!dv.src.endsWith(`demo-${lang}.mp4`)) { dv.poster = `img/demo-${lang}.jpg`; dv.src = `img/demo-${lang}.mp4`; dv.play().catch(() => {}); }
  document.querySelectorAll("[data-i]").forEach((e) => { e.textContent = t[e.dataset.i]; });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lang));
  const sets = {
    win: [[/\.exe$/i, t.exe]],
    mac: [[/aarch64\.dmg$/i, t.arm], [/(x64|x86_64)\.dmg$/i, t.intel]],
    linux: [[/\.AppImage$/i, t.appimg], [/\.deb$/i, t.deb]]
  };
  for (const os of ["win", "mac", "linux"]) {
    const html = sets[os].map(([re, label]) => linkHtml(pick(re), label)).join("");
    document.getElementById("l-" + os).innerHTML = html || `<small>${t.none}</small>`;
  }
  document.querySelector(`[data-os=${OS}]`).classList.add("me");
  const first = pick(OS === "win" ? /\.exe$/i : OS === "mac" ? /aarch64\.dmg$/i : /\.AppImage$/i);
  document.getElementById("main-dl").href = first ? first.browser_download_url : "#download";
  document.getElementById("note").textContent = release ? `${t.ver} ${release.tag_name.replace(/^v/, "")}` : "";
}

document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
  lang = b.dataset.l;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
}));
const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: 0.12 });
document.querySelectorAll(".reveal-s").forEach((e) => io.observe(e));
const win = document.getElementById("win");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  window.addEventListener("pointermove", (e) => {
    const x = e.clientX / innerWidth - 0.5, y = e.clientY / innerHeight - 0.5;
    win.style.transform = `rotateY(${x * 7}deg) rotateX(${-y * 5}deg)`;
  });
}
render();
fetch(`https://api.github.com/repos/${REPO}/releases/latest`).then((r) => (r.ok ? r.json() : null)).then((j) => { release = j; render(); }).catch(() => {});
</script>
